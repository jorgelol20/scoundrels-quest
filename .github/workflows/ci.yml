name: CI

on:
  push:
    branches:
      - master
      - develope
  pull_request:

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests (incluye paridad i18n es/en)
        run: pnpm run test

      - name: Build
        run: pnpm run build

  back-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: PHP syntax (back/src)
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || fail=1
          done < <(find back/src/app back/src/routes back/src/database back/src/lang back/src/bootstrap back/src/config -name '*.php')
          exit $fail
