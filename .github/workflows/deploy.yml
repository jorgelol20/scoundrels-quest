name: Deploy and Build on Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Run Build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:~/.local/share/pnpm

            cd /root/scoundrels-quest
            git pull

            cd ./front
            pnpm install
            pnpm run build

            cd ../back
            docker compose down
            docker compose up -d --build
          
            echo "Waiting for database..."
            for i in $(seq 1 30); do
              docker compose exec -T db mysqladmin ping -h localhost --silent && break
              sleep 2
            done

            docker compose exec -T php php artisan storage:link
            docker compose exec -T php php artisan migrate --force
            docker compose exec -T php php artisan migrate:status

            docker compose exec -T php php artisan db:seed --class=Habilidades --force
            docker compose exec -T php php artisan db:seed --class=Personajes --force
            docker compose exec -T php php artisan db:seed --class=Cartas --force
            docker compose exec -T php php artisan db:seed --class=Modificadores --force